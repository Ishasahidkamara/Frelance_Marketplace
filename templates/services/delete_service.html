{% extends 'base.html' %}
{% block title %}Delete Service{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center">
            <div class="card border-0 shadow p-5">
                <i class="bi bi-trash text-danger fs-1 mb-3"></i>
                <h4 class="fw-bold">Delete Service?</h4>
                <p class="text-muted">Are you sure you want to delete "<strong>{{ service.title }}</strong>"? This action cannot be undone.</p>
                <form method="POST" class="d-flex justify-content-center gap-3 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'freelancers:my_profile' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
